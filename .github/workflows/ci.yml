name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Nx affected needs history to diff against the base branch.
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed (see .gitignore) —
      # every downstream typecheck/build of the api needs it regenerated
      # first. Doesn't need a live database, just prisma/schema.prisma.
      - run: pnpm exec prisma generate --schema apps/api/prisma/schema.prisma

      - name: Set base for nx affected (PRs only)
        if: github.event_name == 'pull_request'
        run: echo "NX_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"

      # `mobile:build` is EAS Build (a cloud service) and needs an
      # EXPO_TOKEN secret this workflow doesn't set up — see README.md
      # "Mobile app" for the manual `eas build`/`eas update` commands.
      # `mobile:export` is the free local equivalent: it runs Metro for
      # real and is what actually catches a broken import/bundle.
      - name: Lint, typecheck, test, build — affected
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec nx affected -t lint typecheck test --base=$NX_BASE
          pnpm exec nx affected -t build --base=$NX_BASE --exclude=@org/mobile
          # No-op unless the mobile app (or something it depends on) is
          # actually affected — `export` only exists as a target on @org/mobile.
          pnpm exec nx affected -t export --base=$NX_BASE

      - name: Lint, typecheck, test, build — all projects
        if: github.event_name != 'pull_request'
        run: |
          pnpm exec nx run-many -t lint typecheck test --all
          pnpm exec nx run-many -t build --all --exclude=@org/mobile
          pnpm exec nx run @org/mobile:export
